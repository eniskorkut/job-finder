name: job-finder

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: job-finder-backend:latest
  volumes:
    - job_finder_data:/app/data
    - ./backend/.env.local:/app/.env.local:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    - DATABASE_URL=sqlite:////app/data/jobhunter.db
    - DATA_DIR=/app/data
    - FRONTEND_URL=http://localhost:3000
    - BACKEND_URL=http://localhost:8000
    - WEB_SEARCH_SEARXNG_URL=${WEB_SEARCH_SEARXNG_URL:-http://searxng:8080}
    - ENABLE_ACCEPTANCE_TEST_HOOKS=true

services:
  backend-migrate:
    <<: *backend-common
    command: alembic upgrade head
    restart: "no"

  searxng:
    image: searxng/searxng:latest
    container_name: job-finder-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-jobfinder-searxng-secret-key-32-chars-long!!}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/search?q=test&format=json', timeout=4)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend-api:
    <<: *backend-common
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "8000:8000"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend-worker:
    <<: *backend-common
    command: python -m app.worker
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      searxng:
        condition: service_started

volumes:
  job_finder_data:
    name: job_finder_data

