[project]
name = "job-hunter-backend"
version = "0.1.0"
description = "Job Hunter API - Phase 1 (architecture, user management, mock jobs)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "argon2-cffi>=23.1",
  "cryptography>=44.0",
  "python-multipart>=0.0.20",
  "email-validator>=2.2",
  "httpx==0.28.1",
  "httpcore==1.0.9",
  # phase 2: mailbox scanning and CV text extraction
  "msal>=1.31",
  "beautifulsoup4>=4.13",
  "lxml>=5.0",
  "pymupdf>=1.24",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
